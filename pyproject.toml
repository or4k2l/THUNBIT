[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "thunbit"
version = "0.1.0"
description = "Research prototype for detecting demand-regime instability in daily SKU-level demand series."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
    "pandas>=1.4",
    "scipy>=1.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "jupyter",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["thunbit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
